; Godot 4.3 export presets for the M0 skeleton (route A, INTERNAL ONLY).
; Two one-click targets used by .github/workflows/build-release.yml:
;   "Windows Desktop" -> build/windows/hook3d.exe
;   "Web"             -> build/web/index.html
; "hook3d" is the internal project codename. Route A builds must never be
; published, listed, commercialised or served on a publicly reachable site.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/rules/*.json, data/stages/*.json, data/packs/**/*.json"
exclude_filter="tools/*, .github/*"
export_path="build/windows/hook3d.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug_export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; Disabled on purpose: Godot's portable Windows build has no rcedit, and the CI
; runners do not ship one either. Keeping it off makes exports warning-free.
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=0
application/file_version="0.4.0"
application/product_version="0.4.0"
application/company_name=""
application/product_name="hook3d (internal)"
application/file_description="2.5D faithful remake - M4 Stage 1-2 playable - internal use only"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/rules/*.json, data/stages/*.json, data/packs/**/*.json"
exclude_filter="tools/*, .github/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
