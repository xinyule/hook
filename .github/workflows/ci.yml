name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Data & policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate data-driven configs
        run: node tools/validate_data.js

      - name: Internal-only and artifact policy
        shell: bash
        run: |
          set -euo pipefail
          # Route A is single-track and internal-only; a public/B pack must not return.
          if [ -d assets/packs/public ]; then
            echo "::error::public pack directory found (route B cancelled)"
            exit 1
          fi
          if ! grep -Eq '"public_release"[[:space:]]*:[[:space:]]*false' data/packs/pack_manifest.json; then
            echo "::error::route A must stay internal-only"
            exit 1
          fi
          if [ -d export ] || [ -d build ]; then
            echo "::error::build artifacts must not be committed"
            exit 1
          fi
          if ! grep -Eq '^config/version="[0-9]+\.[0-9]+\.[0-9]+"$' project.godot; then
            echo "::error::project.godot has no valid config/version"
            exit 1
          fi
          grep -m1 'config/version=' project.godot
          echo "internal-only policy and version gate OK"

  selftest:
    name: Godot M8 headless selftest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 headless editor
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.3-stable_linux.x86_64

      # A fresh checkout has no .godot/ global class cache; without this pass
      # class_name references (M2Actor / M2Player / M2Data / M3StageRunner / M4Boss / M6Boss / M8Arena …) fail to resolve.
      - name: Import project and register global classes
        shell: bash
        run: ./.godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run M8 logic assertions
        shell: bash
        run: |
          set -euo pipefail
          ./.godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 900 -- --selftest 2>&1 | tee selftest.log
          grep -q "SELFTEST PASS" selftest.log
          if grep -q "SELFTEST FAIL" selftest.log || grep -q "SCRIPT ERROR" selftest.log; then
            echo "::error::M8 selftest reported failures"
            exit 1
          fi
          echo "M8 selftest: 205 assertions passed"
