name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: '4.3-stable'
  GODOT_RELEASE_BASE: 'https://github.com/godotengine/godot/releases/download/4.3-stable'
  PRODUCT: 'hook3d'
  VERSION_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  # Create the release shell first. Build jobs upload their zips directly to it,
  # so no Actions artifact storage is needed (the account quota is exhausted).
  create-release:
    name: Create release shell
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove stale release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          printf '%s\n' "## ${TAG} (internal)" "" \
            "INTERNAL ONLY - route A faithful remake. Do not publish, share or redistribute." \
            "This repository and its releases are private by design; GitHub Pages is deliberately not used." "" \
            "Automated Godot 4.3 export from tag ${TAG}." "" \
            "Artifacts:" \
            "- Windows x86_64: zipped exe + pck" \
            "- Web: zipped static build (serve over HTTP, not file://)" \
            "- Android: zipped APK (on-screen virtual buttons)" "" \
            "Build and data gates are enforced by .github/workflows/ci.yml." > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TAG} (internal)" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag

  build-windows:
    name: Windows x86_64
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configs
        run: node tools/validate_data.js

      - name: Install Godot editor and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -L --fail --retry 3 -sS -o godot-editor.zip "${env:GODOT_RELEASE_BASE}/Godot_v4.3-stable_win64.exe.zip"
          Expand-Archive -Path godot-editor.zip -DestinationPath .godot-bin -Force
          curl.exe -L --fail --retry 3 -sS -o godot-templates.zip "${env:GODOT_RELEASE_BASE}/Godot_v4.3-stable_export_templates.tpz"
          Expand-Archive -Path godot-templates.zip -DestinationPath godot-templates -Force
          $dest = Join-Path $env:APPDATA "Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "godot-templates\templates\*" -Destination $dest -Recurse -Force
          Get-ChildItem $dest | Select-Object -First 5 -ExpandProperty Name

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          # The portable editor .exe is a GUI-subsystem app: PowerShell returns
          # immediately and never sets $LASTEXITCODE. Use the console wrapper.
          $exe = (Get-ChildItem -Path .godot-bin -Filter "*console.exe" -File | Select-Object -First 1).FullName
          Write-Host "engine: $exe"
          & $exe --headless --path . --export-release "Windows Desktop" "build/windows/$env:PRODUCT.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed with code $LASTEXITCODE" }
          Get-ChildItem -Recurse build/windows | Select-Object FullName, Length

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $lines = @("product=$env:PRODUCT", "version=$env:VERSION_LABEL", "commit=$env:GITHUB_SHA", "platform=windows-x86_64", "phase=M0 skeleton")
          $lines | Set-Content -Path build/windows/BUILD_INFO.txt -Encoding utf8
          $name = "{0}_{1}_windows_x86_64.zip" -f $env:PRODUCT, $env:VERSION_LABEL
          Compress-Archive -Path "build/windows/*" -DestinationPath (Join-Path dist $name) -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem dist -Filter *.zip | Select-Object -First 1).FullName
          gh --version
          gh release upload "$env:TAG" $zip --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed with code $LASTEXITCODE" }

  build-web:
    name: Web
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configs
        run: node tools/validate_data.js

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o godot.zip "$GODOT_RELEASE_BASE/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          curl -fsSL --retry 3 -o templates.zip "$GODOT_RELEASE_BASE/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.zip -d godot-templates
          dest="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$dest"
          cp -r godot-templates/templates/. "$dest/"
          chmod +x .godot-bin/Godot_v4.3-stable_linux.x86_64
          ls "$dest" | head -5

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          ./.godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Web" "build/web/index.html"
          ls -lh build/web

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          printf 'product=%s\nversion=%s\ncommit=%s\nplatform=web\nphase=M0 skeleton\n' "$PRODUCT" "$VERSION_LABEL" "$GITHUB_SHA" > build/web/BUILD_INFO.txt
          (cd build/web && zip -qr "../../dist/${PRODUCT}_${VERSION_LABEL}_web.zip" .)
          ls -lh dist

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          gh --version
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-android:
    name: Android
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configs
        run: node tools/validate_data.js

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o godot.zip "$GODOT_RELEASE_BASE/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          curl -fsSL --retry 3 -o templates.zip "$GODOT_RELEASE_BASE/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.zip -d godot-templates
          dest="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$dest"
          cp -r godot-templates/templates/. "$dest/"
          chmod +x .godot-bin/Godot_v4.3-stable_linux.x86_64

      - name: Install Android SDK cmdline-tools
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Export Android build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          ./.godot-bin/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Android" "build/android/$PRODUCT.apk"
          ls -lh build/android

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          printf 'product=%s\nversion=%s\ncommit=%s\nplatform=android\nphase=M9 internal final\n' "$PRODUCT" "$VERSION_LABEL" "$GITHUB_SHA" > build/android/BUILD_INFO.txt
          (cd build/android && zip -qr "../../dist/${PRODUCT}_${VERSION_LABEL}_android.zip" .)
          ls -lh dist

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          gh --version
          gh release upload "$TAG" dist/*android*.zip --repo "$GITHUB_REPOSITORY" --clobber
